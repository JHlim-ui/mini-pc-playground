version: '3.8'

services:
  weather-agent:
    build: ./agents/weather
    container_name: weather-agent
    env_file: .env
    restart: unless-stopped
    ports:
      - "5000:5000"   # 카카오 챗봇 Webhook
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data  # 카카오 토큰 저장

networks:
  default:
    name: agent-network
